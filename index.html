<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Read Python File in HTML</title>
    <!-- 1. Load the PyScript assets from the CDN -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>The Python output will appear below:</h1>
    
    <!-- 2. Link your external Python file -->
    <script type="py" src="/test.py" config='{"packages":[]}'></script>

</body>
</html>
